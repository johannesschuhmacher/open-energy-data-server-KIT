name: Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Clone this repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14.4
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"

      - name: Verify lockfile
        run: uv lock --check

      - name: Compile Python sources
        run: python -m compileall crawler crawler_admin scripts crawler_scheduler.py crawler_admin_server.py

      - name: Build documentation
        run: uv run --only-group docs sphinx-build -b dummy docs/source docs/_build/dummy
