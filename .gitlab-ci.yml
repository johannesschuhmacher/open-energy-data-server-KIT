image: python:3.14.4-slim

stages:
  - verify

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

before_script:
  - python -m pip install --quiet uv==0.11.7

verify:
  stage: verify
  script:
    - uv lock --check
    - python -m compileall crawler crawler_admin scripts crawler_scheduler.py crawler_admin_server.py
    - uv run --only-group docs sphinx-build -b dummy docs/source docs/_build/dummy
