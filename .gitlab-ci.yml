image: python:3.14.4-slim

stages:
  - verify
  - mirror

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GIT_DEPTH: "0"

before_script:
  - python -m pip install --quiet uv==0.11.7

verify:
  stage: verify
  script:
    - uv lock --check
    - python -m compileall crawler crawler_admin scripts crawler_scheduler.py crawler_admin_server.py
    - uv run --only-group docs sphinx-build -b dummy docs/source docs/_build/dummy

mirror_github_main:
  stage: mirror
  image: alpine:3.20
  before_script:
    - 'apk add --no-cache git'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_MIRROR_REPO && $GITHUB_MIRROR_USER && $GITHUB_MIRROR_TOKEN'
  script:
    - 'git remote add github-mirror "https://${GITHUB_MIRROR_USER}:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPO}.git"'
    - 'git push github-mirror HEAD:refs/heads/main'
