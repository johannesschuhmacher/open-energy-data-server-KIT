version = 1

[[annotations]]
path = [
    ".dockerignore",
    ".github/**",
    ".gitlab-ci.yml",
    ".pre-commit-config.yaml",
    ".python-version",
    ".readthedocs.yaml",
    "compose*.yml",
    "CONTRIBUTING.md",
    "data/**",
    "docs/**",
    "Dockerfile*",
    "package-lock.json",
    "playbooks/**",
    "pyproject.toml",
    "ruff.toml",
    "SECURITY.md",
    "scripts/**",
    "uv.lock",
]
precedence = "closest"
SPDX-FileCopyrightText = "OEDS Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    "credentials.env",
    "crawler/.env.example",
]
precedence = "closest"
SPDX-FileCopyrightText = "OEDS Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    "crawler_admin/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "OEDS Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
