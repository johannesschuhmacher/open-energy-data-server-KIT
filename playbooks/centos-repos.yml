- name: Update repositories
  hosts: all
  become: true
  tasks:
  - name: Add EPEL repository
    ansible.builtin.yum_repository:
      name: "epel"
      description: "EPEL repo"
      metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel${releasever_minor:+-z}-$releasever&arch=$basearch"
      gpgcheck: true
      gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-$releasever_major"
      metadata_expire: "24h"
      enabled: true

  - name: Add CRB repository
    ansible.builtin.yum_repository:
      name: "crb"
      description: "CentOS Stream $releasever - CRB"
      metalink: "https://mirrors.centos.org/metalink?repo=centos-crb-$stream&arch=$basearch&protocol=https,http"
      gpgcheck: true
      gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial-SHA256"
      repo_gpgcheck: false
      metadata_expire: "6h"
      enabled: true

  - name: Add Docker repository
    ansible.builtin.yum_repository:
      name: "docker-ce-stable"
      description: "Docker Community Edition repo"
      baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
      gpgcheck: true
      gpgkey: "https://download.docker.com/linux/centos/gpg"
      enabled: true

  - name: Add nginx repository
    ansible.builtin.yum_repository:
      name: "nginx-mainline"
      description: "nginx mainline repo"
      baseurl: "https://nginx.org/packages/mainline/centos/$releasever/$basearch"
      gpgcheck: true
      gpgkey: "https://nginx.org/keys/nginx_signing.key"
      module_hotfixes: true
      enabled: true

  - name: Add MariaDB repository
    ansible.builtin.yum_repository:
      name: "mariadb"
      description: "MariaDB 12.2 repo"
      baseurl: "https://mirror.netcologne.de/mariadb/yum/12.2/rhel/$releasever/$basearch"
      gpgcheck: true
      gpgkey: "https://mirror.netcologne.de/mariadb/yum/RPM-GPG-KEY-MariaDB"
      enabled: true
