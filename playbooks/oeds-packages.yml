- name: OEDS package installation
  hosts: oeds
  become: true
  vars:
    oeds_package_state: present
  tasks:
  - name: Install Docker packages
    ansible.builtin.dnf:
      name:
        - containerd.io
        - docker-ce
        - docker-ce-cli
        - docker-ce-rootless-extras
        - docker-buildx-plugin
        - docker-compose-plugin
      state: "{{ oeds_package_state }}"
