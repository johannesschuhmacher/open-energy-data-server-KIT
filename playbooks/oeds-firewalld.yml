- name: OEDS firewalld config
  hosts: oeds
  remote_user: root
  tasks:
  - name: Permanently disable cockpit service
    ansible.posix.firewalld:
      zone: public
      service: cockpit
      state: disabled
      permanent: true
      immediate: true
  - name: Permit traffic in default zone for dhcpv6-client service
    ansible.posix.firewalld:
      zone: public
      service: dhcpv6-client
      permanent: true
      state: enabled
      immediate: true
  - name: Permit traffic in default zone for ms-wbt (remote desktop) service
    ansible.posix.firewalld:
      zone: public
      service: ms-wbt
      permanent: true
      state: enabled
      immediate: true
  - name: Permit traffic in default zone for ssh service
    ansible.posix.firewalld:
      zone: public
      service: ssh
      permanent: true
      state: enabled
      immediate: true
  - name: Permit traffic in default zone for http service
    ansible.posix.firewalld:
      zone: public
      service: http
      permanent: true
      state: enabled
      immediate: true
  - name: Permit traffic in default zone for https service
    ansible.posix.firewalld:
      zone: public
      service: https
      permanent: true
      state: enabled
      immediate: true
  - name: Permit traffic in default zone for port 444/tcp
    ansible.posix.firewalld:
      zone: public
      port: 444/tcp
      permanent: true
      state: enabled
      immediate: true
