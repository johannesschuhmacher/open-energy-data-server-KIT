repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        files: '^(README\.md|CONTRIBUTING\.md|\.github/.*|\.pre-commit-config\.yaml|docs/source/.*|crawler_admin/gapfill_service\.py|crawler_admin/runtime_service\.py|crawler_admin_server\.py|crawler_core/.*|crawler_scheduler\.py|oeds_gapfill/.*|scripts/gapfill_timeseries\.py|scripts/lib/gapfill\.py|scripts/refresh_entsoe_availability_map\.py|tests/test_gapfill_config\.py|tests/test_gapfiller_core\.py|tests/test_public_facades\.py|tests/test_runtime_env\.py)$'
      - id: trailing-whitespace
        files: '^(README\.md|CONTRIBUTING\.md|\.github/.*|\.pre-commit-config\.yaml|docs/source/.*|crawler_admin/gapfill_service\.py|crawler_admin/runtime_service\.py|crawler_admin_server\.py|crawler_core/.*|crawler_scheduler\.py|oeds_gapfill/.*|scripts/gapfill_timeseries\.py|scripts/lib/gapfill\.py|scripts/refresh_entsoe_availability_map\.py|tests/test_gapfill_config\.py|tests/test_gapfiller_core\.py|tests/test_public_facades\.py|tests/test_runtime_env\.py)$'
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
        files: '^(crawler_admin/gapfill_service\.py|crawler_admin/runtime_service\.py|crawler_admin_server\.py|crawler_core/.*|crawler_scheduler\.py|oeds_gapfill/.*|scripts/gapfill_timeseries\.py|scripts/refresh_entsoe_availability_map\.py|tests/test_gapfill_config\.py|tests/test_gapfiller_core\.py|tests/test_public_facades\.py|tests/test_runtime_env\.py)$'
      - id: ruff-format
        files: '^(crawler_admin/gapfill_service\.py|crawler_admin/runtime_service\.py|crawler_admin_server\.py|crawler_core/.*|crawler_scheduler\.py|oeds_gapfill/.*|scripts/gapfill_timeseries\.py|scripts/refresh_entsoe_availability_map\.py|tests/test_gapfill_config\.py|tests/test_gapfiller_core\.py|tests/test_public_facades\.py|tests/test_runtime_env\.py)$'
