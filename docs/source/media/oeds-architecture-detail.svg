<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">OEDS architecture overview</title>
  <desc id="desc">Open Energy Data Server architecture with data sources, crawlers, operations, PostgreSQL TimescaleDB storage, APIs, dashboards, and deployment components.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .card-soft { fill: #f8fafc; stroke: #dbe3ee; stroke-width: 1.5; }
      .title { font: 700 38px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .section-title { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 18px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .text { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .mono { font: 600 14px Consolas, "Courier New", monospace; fill: #334155; }
      .pill { rx: 16; ry: 16; stroke-width: 1.5; }
      .pill-text { font: 600 14px "Segoe UI", Arial, sans-serif; }
      .arrow { fill: none; stroke: #0284c7; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
      .icon-stroke { fill: none; stroke: #0f172a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#64748b"/>
    </marker>
    <linearGradient id="dbGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1800" height="1160"/>
  <text class="title" x="60" y="58">Open Energy Data Server Architecture</text>
  <text class="subtitle" x="60" y="91">Crawler-driven ingestion, PostgreSQL/TimescaleDB storage, REST and SQL access, and Grafana dashboards for energy-system analysis.</text>

  <g transform="translate(60 125)">
    <rect class="card" width="380" height="625" rx="20"/>
    <circle class="icon-fill" cx="40" cy="40" r="24"/>
    <path class="icon-stroke" d="M29 44h22M31 35h18M34 53h12"/>
    <text class="section-title" x="78" y="48">External data sources</text>

    <rect class="card-soft" x="25" y="85" width="330" height="150" rx="16"/>
    <text class="label" x="45" y="118">Open / public sources</text>
    <text class="text" x="45" y="149">SMARD, Eurostat, ENTSOG</text>
    <text class="text" x="45" y="175">DWD CDC, Open-Meteo, SciGRID</text>
    <text class="text" x="45" y="201">regelleistung.net, Trading Hub Europe</text>
    <text class="text" x="45" y="227">OSM / Overpass, Global Energy Monitor</text>

    <rect class="card-soft" x="25" y="255" width="330" height="150" rx="16"/>
    <text class="label" x="45" y="288">Credentialed sources</text>
    <text class="text" x="45" y="319">ENTSO-E FMS, EPEX SPOT SFTP</text>
    <text class="text" x="45" y="345">Netztransparenz OAuth2</text>
    <text class="text" x="45" y="371">GIE AGSI / ALSI, Copernicus CDS</text>
    <text class="text" x="45" y="397">U.S. EIA Open Data API</text>

    <rect class="card-soft" x="25" y="425" width="330" height="112" rx="16"/>
    <text class="label" x="45" y="458">Configured / commercial feeds</text>
    <text class="text" x="45" y="489">Energy Forecast price forecasts</text>
    <text class="text" x="45" y="515">PRISMA Capacity Platform API</text>

    <rect class="pill" x="25" y="565" width="330" height="36" fill="#dcfce7" stroke="#16a34a"/>
    <text class="pill-text" x="45" y="588" fill="#166534">Access model is tracked per crawler</text>
  </g>

  <g transform="translate(490 125)">
    <rect class="card" width="380" height="625" rx="20"/>
    <circle class="icon-fill" cx="40" cy="40" r="24"/>
    <path class="icon-stroke" d="M40 25v16l12 8M23 40a17 17 0 1 0 5-12"/>
    <text class="section-title" x="78" y="48">Crawlers and operations</text>

    <rect class="card-soft" x="25" y="85" width="330" height="105" rx="16"/>
    <text class="label" x="45" y="118">Scheduler</text>
    <text class="mono" x="45" y="146">crawler_scheduler.py</text>
    <text class="text" x="45" y="171">cron schedules, retries, email alerts</text>

    <rect class="card-soft" x="25" y="210" width="330" height="105" rx="16"/>
    <text class="label" x="45" y="243">Crawler modules</text>
    <text class="mono" x="45" y="271">crawler/*.py</text>
    <text class="text" x="45" y="296">per-source loaders and schema writes</text>

    <rect class="card-soft" x="25" y="335" width="330" height="105" rx="16"/>
    <text class="label" x="45" y="368">Post-run processing</text>
    <text class="text" x="45" y="399">gap filling, metadata refreshes,</text>
    <text class="text" x="45" y="425">availability maps, dashboard support</text>

    <rect class="card-soft" x="25" y="460" width="330" height="125" rx="16"/>
    <text class="label" x="45" y="493">Crawler Admin UI</text>
    <text class="text" x="45" y="524">manual runs, YAML editing, logs,</text>
    <text class="text" x="45" y="550">run history, operational status</text>
    <text class="mono" x="45" y="576">localhost:3010/admin</text>
  </g>

  <g transform="translate(920 125)">
    <rect class="card" width="360" height="625" rx="20"/>
    <circle cx="40" cy="40" r="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <path class="icon-stroke" d="M24 34c0-8 32-8 32 0v28c0 8-32 8-32 0zM24 34c0 8 32 8 32 0M24 48c0 8 32 8 32 0"/>
    <text class="section-title" x="78" y="48">OEDS data platform</text>

    <rect x="30" y="88" width="300" height="210" rx="18" fill="url(#dbGradient)" opacity="0.95"/>
    <text x="55" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">PostgreSQL 18</text>
    <text x="55" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#ecfeff">TimescaleDB time-series</text>
    <text x="55" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#ecfeff">PostGIS spatial support</text>
    <text x="55" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ecfeff">source schemas, hypertables, views</text>
    <text x="55" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#ecfeff">readonly role for HTTP export</text>

    <rect class="card-soft" x="25" y="325" width="310" height="106" rx="16"/>
    <text class="label" x="45" y="358">Core schemas</text>
    <text class="text" x="45" y="389">weather, entsoe_fms, smard, eurostat,</text>
    <text class="text" x="45" y="415">mastr, epex_spot, entsog</text>

    <rect class="card-soft" x="25" y="455" width="310" height="126" rx="16"/>
    <text class="label" x="45" y="488">Additional source schemas</text>
    <text class="small" x="45" y="518">netztransparenz, regelleistung, gie_agsi_alsi,</text>
    <text class="small" x="45" y="542">tradinghub, osm_power, scigrid, dwd_cdc,</text>
    <text class="small" x="45" y="566">copernicus_cds, open_meteo, gem, eia, prisma</text>

    <rect class="pill" x="25" y="600" width="310" height="36" fill="#fef3c7" stroke="#f59e0b"/>
    <text class="pill-text" x="45" y="623" fill="#92400e">metadata, access_status, gapfilled schemas</text>
  </g>

  <g transform="translate(1330 125)">
    <rect class="card" width="410" height="625" rx="20"/>
    <circle class="icon-fill" cx="40" cy="40" r="24"/>
    <path class="icon-stroke" d="M24 54h32M28 28h24v18H28zM32 62h16"/>
    <text class="section-title" x="78" y="48">Interfaces and users</text>

    <rect class="card-soft" x="25" y="85" width="360" height="105" rx="16"/>
    <text class="label" x="45" y="118">Grafana dashboards</text>
    <text class="text" x="45" y="149">weather, ENTSO-E cockpits, maps, alerts,</text>
    <text class="text" x="45" y="175">and additional-source dashboards</text>

    <rect class="card-soft" x="25" y="210" width="360" height="92" rx="16"/>
    <text class="label" x="45" y="243">PostgREST API</text>
    <text class="text" x="45" y="274">readonly HTTP access to tables and views</text>

    <rect class="card-soft" x="25" y="322" width="360" height="92" rx="16"/>
    <text class="label" x="45" y="355">PgAdmin / SQL</text>
    <text class="text" x="45" y="386">schema inspection and ad-hoc analysis</text>

    <rect class="card-soft" x="25" y="434" width="360" height="92" rx="16"/>
    <text class="label" x="45" y="467">Python, notebooks, scripts</text>
    <text class="text" x="45" y="498">exports, research workflows, custom clients</text>

    <rect class="card-soft" x="25" y="546" width="360" height="52" rx="16"/>
    <text class="label" x="45" y="580">Students, researchers, applications</text>
  </g>

  <path class="arrow" d="M450 440 C475 440 475 440 490 440"/>
  <path class="arrow" d="M880 440 C900 440 900 440 920 440"/>
  <path class="arrow" d="M1290 440 C1310 440 1310 440 1330 440"/>

  <g transform="translate(60 790)">
    <rect class="card" width="1680" height="245" rx="20"/>
    <text class="section-title" x="28" y="45">Deployment, provisioning, and runtime state</text>

    <rect class="card-soft" x="28" y="78" width="390" height="125" rx="16"/>
    <text class="label" x="52" y="112">Docker Compose profiles</text>
    <text class="text" x="52" y="145">core stack, crawlers profile, ops profile</text>
    <text class="small" x="52" y="174">PostgreSQL, PgAdmin, PostgREST, Grafana, Portainer</text>

    <rect class="card-soft" x="450" y="78" width="370" height="125" rx="16"/>
    <text class="label" x="474" y="112">Runtime directory support</text>
    <text class="mono" x="474" y="143">OEDS_RUNTIME_DIR</text>
    <text class="small" x="474" y="174">config, credentials, data, logs outside checkout</text>

    <rect class="card-soft" x="850" y="78" width="370" height="125" rx="16"/>
    <text class="label" x="874" y="112">Provisioned services</text>
    <text class="text" x="874" y="145">Grafana dashboards and datasources</text>
    <text class="small" x="874" y="174">PgAdmin server config, dashboard JSON</text>

    <rect class="card-soft" x="1250" y="78" width="390" height="125" rx="16"/>
    <text class="label" x="1274" y="112">Operations and rollout</text>
    <text class="text" x="1274" y="145">Ansible playbooks, validation guides</text>
    <text class="small" x="1274" y="174">backup, restore, migration, deployment docs</text>
  </g>

  <path class="arrow-soft" d="M275 790 C275 765 275 765 275 750"/>
  <path class="arrow-soft" d="M680 790 C680 765 680 765 680 750"/>
  <path class="arrow-soft" d="M1100 790 C1100 765 1100 765 1100 750"/>
  <path class="arrow-soft" d="M1535 790 C1535 765 1535 765 1535 750"/>
</svg>
